<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>สมาชิก TOYSKUB</title><link rel="stylesheet" href="./member.css"></head><body><main class="shell"><a href="/" class="brand">TK · TOYSKUB</a><section id="account" class="card hidden"><h1>บัญชีของฉัน</h1><p id="accountName"></p><p id="accountDetails"></p><button id="logout">ออกจากระบบ</button></section><div id="forms" class="grid"><section class="card"><h1>เข้าสู่ระบบสมาชิก</h1><form id="loginForm"><label>อีเมล<input id="loginEmail" type="email" required></label><label>รหัสผ่าน<input id="loginPassword" type="password" required></label><button>เข้าสู่ระบบ</button></form><p id="loginMessage"></p></section><section class="card"><h1>สมัครสมาชิก</h1><form id="registerForm"><div class="two"><label>ชื่อ<input id="firstName" required></label><label>นามสกุล<input id="lastName"></label></div><label>อีเมล<input id="email" type="email" required></label><label>เบอร์มือถือ<input id="phone" inputmode="tel" placeholder="08xxxxxxxx" maxlength="12" required></label><label>รหัสผ่าน<input id="password" type="password" minlength="8" required></label><button>สมัครสมาชิก</button></form><p id="registerMessage"></p></section></div></main><script src="./member.js"></script></body></html>
